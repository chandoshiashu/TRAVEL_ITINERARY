<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Smart Travel Planner</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans p-6">
    <div class="max-w-4xl mx-auto space-y-8">
        
        <!-- Header -->
        <header class="text-center py-6">
            <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">Dynamic Itinerary Builder</h1>
            <p class="text-slate-400 mt-2">Custom routes optimized by live weather and active transit constraints</p>
        </header>

        <!-- Configuration Panel Layout -->
        <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-xl grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Select Destination</label>
                <select id="city-select" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 text-white focus:outline-none focus:border-cyan-400">
                    <option value="Tokyo">Tokyo (Sunny simulation)</option>
                    <option value="London">London (Rainy / Canceled flight simulation)</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Duration (Days)</label>
                <input id="duration-input" type="number" min="1" max="3" value="2" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 text-white focus:outline-none focus:border-cyan-400">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Travel Persona</label>
                <select id="persona-select" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 text-white focus:outline-none focus:border-cyan-400">
                    <option value="Adventure">Adventure Seeker</option>
                    <option value="Sightseeing">Classic Sightseer / Luxury</option>
                </select>
            </div>

            <div class="md:col-span-3 pt-2">
                <button id="generate-btn" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-600 hover:to-blue-700 text-white font-bold p-4 rounded-xl transition duration-200 shadow-lg">
                    Generate Smart Itinerary 🚀
                </button>
            </div>
        </div>

        <!-- Output Cards Wrapper -->
        <div id="result-container" class="hidden space-y-6">
            <!-- Intelligence Report Box -->
            <div class="bg-slate-800/50 border border-slate-700 p-5 rounded-xl grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <span class="text-xs uppercase font-bold text-slate-400">Forecast Matrix</span>
                    <p id="report-weather" class="text-lg font-semibold text-amber-400 mt-1">Checking...</p>
                </div>
                <div>
                    <span class="text-xs uppercase font-bold text-slate-400">Transit Routing Hub</span>
                    <p id="report-transit" class="text-sm text-slate-300 mt-1">Checking...</p>
                </div>
            </div>

            <!-- Dynamic Timelines Output Grid -->
            <div id="itinerary-timeline" class="grid grid-cols-1 gap-4"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
